spring:
  application:
    name: redis

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000

  # DevTools 옵션
  devtools:
    # 핫 리스타트 기능 활성화
    restart:
      enabled: true
    # 라이브 리로드 기능 활성화
    livereload:
      enabled: true

  # application.properties
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html